# VASTRIX — observability stack (specification §24, instruction §48).
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Metrics -> Prometheus -> Grafana
# Logs    -> Promtail   -> Loki -> Grafana
# Errors  -> GlitchTip
#
# None of these services publishes a port to a public interface. Every published port is bound to
# 127.0.0.1, so access requires an SSH tunnel or a VPN:
#
#   ssh -L 3001:127.0.0.1:3001 user@host      # then browse http://localhost:3001
#
# Instruction §48 is explicit: "Do not expose monitoring dashboards publicly without
# authentication." Binding to loopback means they are not reachable even if authentication is
# later misconfigured.

name: vastrix

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: vastrix-prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      # Served under a sub-path so it can sit behind an authenticating proxy later.
      - --web.external-url=http://localhost:9090
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback only.
      - '127.0.0.1:9090:9090'
    networks:
      - internal
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.1
    container_name: vastrix-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      # Anonymous access is off, and sign-up is off: a dashboard showing operational detail is not
      # public information.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: 'strict'
      GF_SECURITY_CONTENT_TYPE_PROTECTION: 'true'
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_INSTALL_PLUGINS: ''
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.4.2
    container_name: vastrix-loki
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.4.2
    container_name: vastrix-promtail
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/monitoring/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Reads container logs from the host. Mounted read-only — a log shipper has no reason to
      # write to the Docker socket directory.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks:
      - internal

  # ---------------------------------------------------------------------------------------------
  # Exporters
  # ---------------------------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: vastrix-node-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: vastrix-postgres-exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vastrix}?sslmode=disable'
      PG_EXPORTER_EXCLUDE_DATABASES: 'template0,template1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: vastrix-cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal

  # ---------------------------------------------------------------------------------------------
  # Error tracking (specification §24)
  # ---------------------------------------------------------------------------------------------
  glitchtip:
    image: glitchtip/glitchtip:v4.2.5
    container_name: vastrix-glitchtip
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY}
      PORT: 8080
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8080}
      # Closed registration: an error-tracking instance holds stack traces and request context.
      ENABLE_OPEN_USER_REGISTRATION: 'False'
      ENABLE_ORGANIZATION_CREATION: 'False'
      CELERY_WORKER_AUTOSCALE: '1,3'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
