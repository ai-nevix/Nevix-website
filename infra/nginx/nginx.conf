# NEVIX — Nginx main configuration (specification §22, instruction §42).
#
# Responsibilities: TLS termination, routing, security headers, rate limiting, request size
# limits and static asset caching.
#
# Monitoring endpoints are deliberately NOT proxied here. Prometheus, Grafana and Loki are
# reachable only over the internal Docker network (instruction §48).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------------------------------
    # Logging — JSON so Loki/Promtail can parse it without a regex.
    # Deliberately omits request bodies, cookies and the Authorization header (instruction §49).
    # ------------------------------------------------------------------------------------------
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"host":"$host",'
        '"request_id":"$request_id"'
      '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ------------------------------------------------------------------------------------------
    # Core behaviour
    # ------------------------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # The server version is not useful to a visitor and is useful to an attacker.
    server_tokens       off;

    # Request size limits (instruction §42). The upload endpoint accepts 10 MB; the allowance
    # here leaves room for multipart overhead without permitting arbitrarily large bodies.
    client_max_body_size        12m;
    client_body_buffer_size     128k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;

    # Slowloris mitigation: a client that opens a connection and sends nothing is dropped.
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          20s;
    reset_timedout_connection on;

    # ------------------------------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/xml;

    # ------------------------------------------------------------------------------------------
    # Rate limiting (specification §22).
    #
    # Two zones, because a browser loading one page issues many asset requests while a form post
    # should be rare. Applying one limit to both would either throttle normal browsing or leave
    # the form unprotected.
    # ------------------------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=5r/s;
    limit_req_zone  $binary_remote_addr  zone=forms:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # ------------------------------------------------------------------------------------------
    # TLS defaults (specification §22). Modern profile: TLS 1.2 and 1.3 only.
    # ------------------------------------------------------------------------------------------
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_stapling               on;
    ssl_stapling_verify        on;
    resolver                   127.0.0.11 valid=30s ipv6=off;
    resolver_timeout           5s;

    # ------------------------------------------------------------------------------------------
    # Proxy defaults
    # ------------------------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    # The backend hashes this for rate limiting, so it must be the real client address.
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Request-ID      $request_id;
    proxy_set_header   Connection        "";

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering       on;
    proxy_buffers         8 16k;
    proxy_buffer_size     16k;

    # Static asset cache for the Next.js build output.
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                     max_size=512m inactive=7d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
