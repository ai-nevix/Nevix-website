# VASTRIX — virtual hosts (specification §20, instruction §42).
#
#   vastrix.ai      -> Next.js
#   www.vastrix.ai  -> 301 to the apex, so one canonical origin ranks
#   api.vastrix.ai  -> FastAPI
#   cms.vastrix.ai  -> Strapi (admin access should additionally be restricted at the firewall)
#
# Monitoring hosts are absent by design: Prometheus, Grafana and Loki are reachable only on the
# internal Docker network (instruction §48).

upstream vastrix_web {
    server web:3000;
    keepalive 32;
}

upstream vastrix_api {
    server api:8000;
    keepalive 16;
}

upstream vastrix_cms {
    server cms:1337;
    keepalive 8;
}

# ------------------------------------------------------------------------------------------------
# Internal health endpoint for the container health check and for the load balancer.
# Bound to port 80 on the container only; not routable from outside.
# ------------------------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/acme-challenge.conf;

    # Everything else on an unrecognised host is redirected to the canonical site rather than
    # being served, so the site cannot be reached through an arbitrary hostname.
    location / {
        return 301 https://vastrix.ai$request_uri;
    }
}

# ------------------------------------------------------------------------------------------------
# HTTP -> HTTPS for the known hosts
# ------------------------------------------------------------------------------------------------
server {
    listen 80;
    server_name vastrix.ai www.vastrix.ai api.vastrix.ai cms.vastrix.ai;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------------------------
# www -> apex
# ------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.vastrix.ai;

    ssl_certificate     /etc/nginx/certs/vastrix.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vastrix.ai/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://vastrix.ai$request_uri;
}

# ------------------------------------------------------------------------------------------------
# vastrix.ai — the website
# ------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name vastrix.ai;

    ssl_certificate     /etc/nginx/certs/vastrix.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vastrix.ai/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/vastrix.ai/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 24;

    # ---- Static build output -------------------------------------------------------------------
    # Content-hashed filenames, so a long immutable cache is safe and a new deploy invalidates
    # by changing the URL.
    location /_next/static/ {
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    # Optimised images are expensive to generate and stable for a given source and size.
    location /_next/image {
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location ~* ^/(brand|images|icons)/ {
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf|otf)$ {
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---- Form submissions ----------------------------------------------------------------------
    # Tighter limit than general browsing. `burst` with `nodelay` absorbs a legitimate double
    # submit without letting a script through.
    location /api/backend/v1/contact {
        limit_req zone=forms burst=3 nodelay;
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/backend/v1/newsletter {
        limit_req zone=forms burst=3 nodelay;
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/backend/v1/uploads {
        limit_req zone=forms burst=2 nodelay;
        client_max_body_size 12m;
        # Uploads stream through; buffering the whole body first would double memory use.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ---- Everything else -----------------------------------------------------------------------
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://vastrix_web;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Blocks scanners probing for a leftover repository or environment file. Returning 404 rather
    # than 403 does not confirm the path is interesting.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}

# ------------------------------------------------------------------------------------------------
# api.vastrix.ai — FastAPI
# ------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.vastrix.ai;

    ssl_certificate     /etc/nginx/certs/vastrix.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vastrix.ai/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 12;

    # Administrative endpoints are not served on the public host at all. They are reachable only
    # from the internal network or over a VPN — authentication alone is not the only control
    # (instruction §31, §74).
    location /api/v1/admin {
        deny all;
        return 404;
    }

    # Prometheus scrapes this over the internal Docker network; it is never public.
    location /metrics {
        deny all;
        return 404;
    }

    # Interactive API docs are disabled in production by the application; blocked here as well.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        deny all;
        return 404;
    }

    location /api/v1/health {
        access_log off;
        proxy_pass http://vastrix_api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/v1/contact {
        limit_req zone=forms burst=3 nodelay;
        proxy_pass http://vastrix_api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/v1/uploads {
        limit_req zone=forms burst=2 nodelay;
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://vastrix_api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://vastrix_api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

# ------------------------------------------------------------------------------------------------
# cms.vastrix.ai — Strapi
#
# Strapi's admin panel is a privileged interface. Restrict it further at the firewall or with an
# IP allow-list before exposing it publicly (instruction §42, §74).
# ------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name cms.vastrix.ai;

    ssl_certificate     /etc/nginx/certs/vastrix.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vastrix.ai/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # Media uploads can be large; the admin also uploads them.
    client_max_body_size 64m;

    limit_conn perip 12;

    # Uncomment and set your office or VPN range before exposing the admin panel publicly.
    # location /admin {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://vastrix_cms;
    #     include /etc/nginx/snippets/proxy-headers.conf;
    # }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://vastrix_cms;
        include /etc/nginx/snippets/proxy-headers.conf;

        # Strapi's admin uses websockets for live reload in some configurations.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
