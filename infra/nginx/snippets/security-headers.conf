# Security headers applied to every response (specification §22, instruction §32).
#
# GENERATED FILE — edit apps/web/lib/security-headers.mjs and run
#   npm run generate:nginx-headers
# so the Next.js layer and the edge layer cannot drift apart.
#
# `always` is required: without it these headers are omitted on error responses, which is exactly
# where clickjacking and sniffing protection still matter.

add_header X-Content-Type-Options        "nosniff" always;
add_header X-Frame-Options               "DENY" always;
add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
add_header X-DNS-Prefetch-Control         "off" always;
add_header Cross-Origin-Opener-Policy     "same-origin" always;
add_header Cross-Origin-Resource-Policy   "same-origin" always;
add_header Permissions-Policy             "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security      "max-age=63072000; includeSubDomains; preload" always;

# Content-Security-Policy is set by the application rather than here, because the policy differs
# between the website (documents) and the API (JSON). See apps/web/lib/security-headers.mjs and
# apps/api/app/main.py, and docs/architecture/adr/ADR-010-csp-unsafe-inline.md for why
# script-src includes 'unsafe-inline'.
