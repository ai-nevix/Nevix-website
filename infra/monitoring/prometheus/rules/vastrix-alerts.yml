# VASTRIX alerting rules (specification §24).
#
# Each rule targets a condition an operator would actually act on. Alerts that fire without a
# clear action are noise, and noisy alerting is how real alerts get ignored.

groups:
  - name: vastrix-availability
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="vastrix-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'The VASTRIX API is not responding to scrapes'
          description: >-
            Prometheus has failed to scrape the API for 2 minutes. The contact form and all
            enquiry capture are likely down.
          runbook: docs/deployment/runbook.md#api-down

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="vastrix-api",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="vastrix-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Over 5% of API requests are failing'
          description: '5xx rate has exceeded 5% for 5 minutes.'
          runbook: docs/deployment/runbook.md#high-error-rate

      - alert: SlowResponses
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="vastrix-api"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API 95th percentile latency above 2 seconds'
          description: 'Sustained for 10 minutes. Check database load and pool saturation.'

  - name: vastrix-resources
    interval: 60s
    rules:
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 15% disk space remaining'
          description: >-
            PostgreSQL stops accepting writes when the disk fills. Prune old images and check
            backup retention before this becomes critical.

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Less than 5% disk space remaining'

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Host memory usage above 90%'

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name=~"vastrix-.*"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} is restarting repeatedly'
          description: 'More than three restarts in 15 minutes indicates a crash loop.'

  - name: vastrix-database
    interval: 60s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL is unreachable'
          runbook: docs/deployment/runbook.md#database-down

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL connection usage above 80%'
          description: 'Check for connection leaks or an undersized pool.'

  - name: vastrix-certificates
    interval: 3600s
    rules:
      # Certificate expiry is a predictable, preventable outage. Thirty days is enough notice to
      # investigate a renewal that has quietly stopped working.
      - alert: TlsCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 30 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate expires in under 30 days'
          description: 'Check that the automated renewal is still running.'
