# VASTRIX — Prometheus scrape configuration (specification §24).
#
# Every target is reached over the internal Docker network. Nothing here is publicly routable.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: vastrix

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI exposes /metrics via prometheus-fastapi-instrumentator. Nginx blocks this path on the
  # public host, so it is reachable only from inside the network.
  - job_name: vastrix-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          component: backend

  # Host metrics: CPU, memory, disk, filesystem, network.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: host

  # Per-container CPU, memory and restart counts.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: containers

  # PostgreSQL connections, transaction rates and database size.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          component: database
