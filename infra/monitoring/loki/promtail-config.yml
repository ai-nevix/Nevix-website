# Promtail — ships container logs to Loki (specification §24, instruction §49).
#
# The application emits structured JSON, so the pipeline parses it and promotes a few fields to
# labels. Only low-cardinality fields become labels: a label per request id would create a new
# stream for every request and destroy Loki's performance.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: nevix-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: name
            values: ['nevix-']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

    pipeline_stages:
      # The API and Nginx both emit JSON; other containers emit plain text. `drop_malformed`
      # keeps a non-JSON line as-is rather than discarding it.
      - json:
          expressions:
            level: level
            event: event
            request_id: request_id
            status: status
            latency_ms: latency_ms
            path: path
          drop_malformed: false

      # Promoted to labels: low cardinality and useful for filtering.
      - labels:
          level:

      # NOT promoted to labels: request_id and path are high-cardinality and remain searchable in
      # the log line itself.

      - timestamp:
          source: time
          format: RFC3339Nano
          action_on_failure: fudge
