# Grafana datasources, provisioned as code so a rebuilt container is immediately usable.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Links a log line's request_id through to matching entries, so an error in Grafana can be
      # traced across services without copying identifiers by hand.
      derivedFields:
        - name: RequestID
          matcherRegex: '"request_id":"([^"]+)"'
          url: '$${__value.raw}'
          datasourceUid: loki
