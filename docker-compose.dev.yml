# NEVIX — local development overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Differences from production:
#   - source is bind-mounted and the dev servers hot-reload
#   - PostgreSQL, the API and the CMS are published to the host so they can be inspected directly
#   - Nginx is not started; the dev servers are reached on their own ports
#   - Mailpit captures outbound email so nothing is sent to a real address during development
#
# Every credential here is a known-weak development value. The API refuses to start in production
# with any of them (see Settings._enforce_production_hardening).

name: nevix-dev

services:
  nginx:
    # Not needed locally: the Next.js dev server is reached directly on port 3000.
    profiles: ['proxy']

  web:
    build:
      target: builder
    command: sh -c "npm run dev --workspace=@nevix/web"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_ENV: local
      CONTENT_PROVIDER: ${CONTENT_PROVIDER:-local}
      CMS_URL: http://cms:1337
      API_INTERNAL_URL: http://api:8000
      # Poll for changes: inotify does not propagate through a bind mount on Windows or macOS.
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      # Anonymous volumes keep the container's installed dependencies from being shadowed by the
      # host directory, which may hold binaries built for a different platform.
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    ports:
      - '3000:3000'
    healthcheck:
      # The dev server compiles on first request, so the start period is longer.
      start_period: 90s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
      - --reload-dir
      - /srv/api/app
    environment:
      APP_ENV: local
      DEBUG: 'true'
      LOG_LEVEL: DEBUG
      LOG_FORMAT: console
      SECRET_KEY: local-development-secret-key-not-for-production-use
      ADMIN_API_KEY: local-development-admin-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://nevix:nevix@postgres:5432/nevix
      DATABASE_ECHO: 'false'
      RATE_LIMIT_ENABLED: 'false'
      # Mailpit accepts anything and shows it in a web UI, so development never sends real mail.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USE_TLS: 'false'
      EMAIL_FROM: no-reply@nevix.local
      EMAIL_NOTIFY_TO: team@nevix.local
      SITE_URL: http://localhost:3000
      UPLOAD_DIR: /var/lib/nevix/uploads
    volumes:
      - ./apps/api/app:/srv/api/app
      - ./apps/api/alembic.ini:/srv/api/alembic.ini:ro
    ports:
      - '8000:8000'

  postgres:
    environment:
      POSTGRES_USER: nevix
      POSTGRES_PASSWORD: nevix
      POSTGRES_DB: nevix
    ports:
      # Published so a local client can inspect the database. Never do this in production.
      - '5432:5432'
    networks:
      - internal
      - edge

  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm run develop"
    environment:
      NODE_ENV: development
      DATABASE_NAME: nevix_cms
      DATABASE_USERNAME: nevix
      DATABASE_PASSWORD: nevix
      APP_KEYS: devKeyOne,devKeyTwo,devKeyThree,devKeyFour
      API_TOKEN_SALT: development-api-token-salt
      ADMIN_JWT_SECRET: development-admin-jwt-secret
      TRANSFER_TOKEN_SALT: development-transfer-token-salt
      JWT_SECRET: development-jwt-secret
    volumes:
      - ./apps/cms/src:/srv/cms/src
      - ./apps/cms/config:/srv/cms/config
    ports:
      - '1337:1337'

  # ---------------------------------------------------------------------------------------------
  # Development-only services
  # ---------------------------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: nevix-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '8025:8025' # web UI
    networks:
      - internal
      - edge
