# NEVIX — GitLab CI/CD (specification §21, instruction §46).
#
#   install -> lint -> type-check -> test -> build -> security
#
# Packaging and deployment are not defined here. The project no longer builds Docker images;
# a replacement deployment method (e.g. bare-metal + systemd) has not been chosen yet — see
# docs/architecture/adr/ADR-005-docker-compose.md.

stages:
  - install
  - verify
  - test
  - build
  - security

variables:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  # Cache inside the project directory so GitLab Runner can cache it between jobs.
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PIP_CACHE_DIR: '$CI_PROJECT_DIR/.pip'
  GIT_DEPTH: '20'

default:
  interruptible: true
  retry:
    max: 2
    # Only infrastructure failures are retried. A failing test is a result, not a flake to retry
    # away.
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# =================================================================================================
# Templates
# =================================================================================================

.node:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

.python:
  image: python:${PYTHON_VERSION}-slim
  cache:
    key:
      files:
        - apps/api/pyproject.toml
    paths:
      - .pip/
    policy: pull
  before_script:
    - cd apps/api
    - pip install --quiet --upgrade pip
    - pip install --quiet -e ".[dev]"

# =================================================================================================
# Install — primes the caches every later job pulls from
# =================================================================================================

install:node:
  stage: install
  extends: .node
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - node --version
    - npm --version
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
      - apps/web/node_modules/

# =================================================================================================
# Verify — formatting, linting, types
# =================================================================================================

lint:web:
  stage: verify
  extends: .node
  needs: ['install:node']
  script:
    - npm run format:check
    - npm run lint

typecheck:web:
  stage: verify
  extends: .node
  needs: ['install:node']
  script:
    - npm run typecheck

lint:api:
  stage: verify
  extends: .python
  needs: []
  script:
    - ruff check app tests
    - ruff format --check app tests

typecheck:api:
  stage: verify
  extends: .python
  needs: []
  # mypy in strict mode surfaces genuine issues in third-party stubs that are outside our control.
  # Reported without blocking the pipeline until the remaining findings are triaged.
  allow_failure: true
  script:
    - mypy app

# -------------------------------------------------------------------------------------------------
# Content governance (instruction §33, §34)
#
# Blocking. A dummy-data marker without a registry entry, or a committed secret, must never reach
# the default branch.
# -------------------------------------------------------------------------------------------------
audit:content-governance:
  stage: verify
  extends: .node
  needs: ['install:node']
  script:
    - npm run audit:dummy-data
    - npm run audit:secrets

# =================================================================================================
# Test
# =================================================================================================

test:web:
  stage: test
  extends: .node
  needs: ['install:node']
  script:
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: apps/web/coverage/junit.xml
    expire_in: 1 week

test:api:
  stage: test
  extends: .python
  needs: []
  services:
    # Tests run against SQLite by default; this PostgreSQL service backs the migration job below
    # and is available for any test that needs real PostgreSQL behaviour.
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: nevix
    POSTGRES_PASSWORD: ci-test-password
    POSTGRES_DB: nevix_test
  script:
    - pytest --cov=app --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: apps/api/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage.xml
    expire_in: 1 week

# -------------------------------------------------------------------------------------------------
# Migrations are verified against real PostgreSQL, not SQLite.
#
# The unit suite runs on SQLite for speed; that would not catch a migration using a PostgreSQL-only
# construct, or one that cannot be reversed. This job applies the full history up and back down.
# -------------------------------------------------------------------------------------------------
test:migrations:
  stage: test
  extends: .python
  needs: []
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: nevix
    POSTGRES_PASSWORD: ci-test-password
    POSTGRES_DB: nevix_migrations
    DATABASE_URL: 'postgresql+asyncpg://nevix:ci-test-password@postgres:5432/nevix_migrations'
    SECRET_KEY: 'ci-migration-secret-key-at-least-32-characters-long'
  script:
    - alembic upgrade head
    - alembic downgrade base
    - alembic upgrade head
    # Fails if the models and the migration history have drifted apart.
    - alembic check

# =================================================================================================
# Build
# =================================================================================================

build:web:
  stage: build
  extends: .node
  needs: ['install:node']
  variables:
    NEXT_PUBLIC_SITE_URL: 'https://nevix.ai'
    NEXT_PUBLIC_ENV: 'production'
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - apps/web/.next/

# -------------------------------------------------------------------------------------------------
# End-to-end and accessibility, against the real production build.
# -------------------------------------------------------------------------------------------------
test:e2e:
  stage: build
  needs: ['build:web', 'install:node']
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    CI: 'true'
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# =================================================================================================
# Security
# =================================================================================================

security:dependencies:
  stage: security
  extends: .node
  needs: ['install:node']
  script:
    # High and critical advisories fail the pipeline. Lower severities are reported for triage
    # rather than blocking a release.
    - npm audit --audit-level=high
    - npm audit --json > npm-audit.json || true
  artifacts:
    when: always
    paths:
      - npm-audit.json
    expire_in: 1 month

security:python-dependencies:
  stage: security
  extends: .python
  needs: []
  script:
    - pip install --quiet pip-audit
    - pip-audit --desc --strict
  allow_failure: false

security:secrets:
  stage: security
  image: zricethezav/gitleaks:latest
  needs: []
  script:
    - gitleaks detect --source . --verbose --redact --no-git
  allow_failure: false

# =================================================================================================
# Packaging and deployment were removed along with Docker. Define a replacement here once a
# deployment method is chosen (see docs/architecture/adr/ADR-005-docker-compose.md).
# =================================================================================================
